# Configuration used by docs/demo.tape to record docs/demo.gif.
[watchdog]
control_socket   = /tmp/pwatchd-demo.sock
heartbeat_socket = /tmp/pwatchd-demo-hb.sock
log_dir          = /tmp/pwatchd-demo-logs

[service:telemetry]
command           = /bin/sh -c 'while true; do echo frame; pwctl beat; sleep 0.5; done'
heartbeat_timeout = 2s

[service:flaky-worker]
command         = /bin/sh -c 'sleep 2; echo "worker crashed" >&2; exit 2'
backoff_initial = 500ms
max_restarts    = 3

[service:frozen]
command           = /bin/sh -c 'for i in 1 2 3; do pwctl beat; sleep 0.3; done; sleep 600'
heartbeat_timeout = 1s
max_restarts      = 1
limit_nofile      = 128
