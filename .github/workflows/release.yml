name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to create and release, e.g. v1.0.0"
        required: true

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPW_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          cmake --build build -j "$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure -j "$(nproc)"
      - name: Package
        run: |
          name="process-watchdog-${TAG}-linux-${{ matrix.arch }}"
          mkdir -p "dist/${name}/bin" "dist/${name}/examples"
          cp build/pwatchd build/pwctl "dist/${name}/bin/"
          strip "dist/${name}/bin/"*
          cp README.md LICENSE CHANGELOG.md "dist/${name}/"
          cp examples/watchdog.ini "dist/${name}/examples/"
          tar -C dist -czf "${name}.tar.gz" "${name}"
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.arch }}
          path: "*.tar.gz"

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Release notes from CHANGELOG
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS
          --target "$GITHUB_SHA" --title "process-watchdog $TAG" --notes-file notes.md
