name: Feature request
description: Suggest an improvement to process-watchdog
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to supervise, and what is missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Configuration keys, CLI commands or behaviour you would like.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
