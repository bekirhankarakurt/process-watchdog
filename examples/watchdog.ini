# Example pwatchd configuration. Relative paths are resolved against the
# directory of this file. Run:  pwatchd -c examples/watchdog.ini

[watchdog]
control_socket   = /tmp/pwatchd.sock
heartbeat_socket = /tmp/pwatchd-hb.sock
log_dir          = logs
log_level        = info

# A long-running service that proves liveness with heartbeats.
[service:telemetry]
command           = /bin/sh -c 'i=0; while true; do i=$((i+1)); echo "frame $i"; pwctl beat; sleep 1; done'
restart           = always
heartbeat_timeout = 3s
heartbeat_grace   = 5s
limit_nofile      = 256
limit_core        = 0

# A flaky worker: crashes every few seconds, restarted with exponential backoff.
[service:flaky-worker]
command         = /bin/sh -c 'echo "worker up"; sleep 3; echo "worker crashed" >&2; exit 2'
restart         = on-failure
backoff_initial = 500ms
backoff_max     = 10s
max_restarts    = 5
stable_after    = 30s
log_max_size    = 1M
log_max_files   = 3

# A one-shot job started manually with:  pwctl start nightly-report
[service:nightly-report]
command   = /bin/sh -c 'echo "report generated at $(date)"'
restart   = never
autostart = false
